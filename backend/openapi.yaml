openapi: 3.1.0
info:
  title: SummaPass API
  version: dev
  description: |
    API penukaran tiket dan antrean event. Respons sukses memakai envelope
    `{ message, data, meta }`, kecuali `204` (tanpa body) dan endpoint `/health/*`.
    Respons gagal memakai `{ error }`, kecuali `503` dari `/health/*`. Semua respons
    mengembalikan `X-Request-ID`; semua respons memakai `Cache-Control: no-store`, kecuali `405` dari router
    dan berkas `/media/{fileName}`.
    Operasi tulis wajib mengirim `X-CSRF-TOKEN` yang sama dengan cookie `antay_csrf`;
    bila tidak, server menjawab `403 CSRF_MISSING` sebelum memeriksa sesi.
    Body JSON dibatasi 1 MB, harus berisi tepat satu objek JSON, dan tidak boleh
    memuat `\u0000`. Unggah gambar memakai `multipart/form-data` dengan batas sendiri.
    Setiap endpoint bisa menjawab `500 INTERNAL` untuk kesalahan tak terduga.

    Ada dua sesi terpisah: `antay_session` untuk akun internal (`/operational/v1`,
    `/analytics/v1`) dan `antay_customer_session` untuk pembeli (`/customer/v1`).
    JWT keduanya beda audiens, jadi menukar cookie tetap `401`. Role internal:
    `staff`, `admin`, `organizer`; admin lolos semua cek role. Rute loket butuh
    `staff`, rute `/operational/v1/manage` butuh `organizer`, akun dan analytics
    butuh `admin`. Data milik penyelenggara lain dijawab `404`, bukan `403`.
    Id di path yang bukan UUID juga dijawab `404`.
servers:
  - url: http://localhost:8080
    description: Lokal
tags:
  - name: public
  - name: customer
    description: Akun pembeli dan hitung harga, sesi `antay_customer_session`.
  - name: operational
  - name: manage
    description: Kelola event, kategori, paket, dan alur status (organizer atau admin).
  - name: media
    description: Poster dan galeri event, serta berkas publik `/media`.
  - name: seating
    description: Denah kursi berbasis blok.
  - name: accounts
    description: Penyelenggara dan akun internal (admin).
  - name: analytics
  - name: system

paths:
  /:
    get:
      tags: [system]
      summary: Info layanan
      operationId: getRoot
      security: []
      responses:
        "200":
          description: Nama layanan dan versinya.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootEnvelope" }

  /csrf:
    get:
      tags: [system]
      summary: Ambil token CSRF
      operationId: getCsrf
      security: []
      responses:
        "204":
          description: Cookie `antay_csrf` dipasang; nilainya dikirim balik di header pada operasi tulis.

  /health/live:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Proses hidup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      tags: [system]
      summary: Readiness probe (menyentuh database)
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Siap menerima trafik.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database tidak siap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/startup:
    get:
      tags: [system]
      summary: Startup probe
      operationId: healthStartup
      security: []
      responses:
        "200":
          description: Siap menerima trafik.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database tidak siap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/dependencies:
    get:
      tags: [system]
      summary: Status dependensi
      operationId: healthDependencies
      security: []
      responses:
        "200":
          description: Semua dependensi UP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Ada dependensi DOWN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /public/v1/events:
    get:
      tags: [public]
      summary: Katalog event yang dijual
      description: >
        Dilayani katalog versi 2 dan tetap membawa semua field `Event` versi 1
        (termasuk `slots`). Isinya event `published` dengan tanggal hari ini atau
        nanti yang penjualannya belum berakhir, urut tanggal lalu nama. Event yang
        belum mulai dijual tetap tampil dengan `onSale: false`.
      operationId: listPublicEvents
      security: []
      responses:
        "200":
          description: Sudah termasuk slot, sisa kuota, dan data jualan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEventListEnvelope" }

  /public/v1/events/{eventId}:
    get:
      tags: [public]
      summary: Detail katalog event
      description: >
        Dilayani katalog versi 2, semua field versi 1 tetap ada. Ditambah kategori
        (hanya paket aktif) dan galeri. Event `published` yang jualannya sudah
        selesai tetap bisa dibuka, cuma `onSale`-nya false.
      operationId: getPublicEvent
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event ditemukan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEventDetailEnvelope" }
        "404":
          $ref: "#/components/responses/Error404"

  /public/v1/events/{eventId}/seat-map:
    get:
      tags: [public, seating]
      summary: Denah kursi untuk pembeli
      description: >
        Hanya event `published`. Status kursi `held` dan `sold` disatukan jadi
        `taken`. Event tanpa layout tersimpan mendapat layout bawaan.
      operationId: getPublicSeatMap
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Layout, blok, dan kursi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSeatMapEnvelope" }
        "404":
          $ref: "#/components/responses/Error404"

  /public/v1/events/{eventId}/board:
    get:
      tags: [public]
      summary: Data papan antrean untuk layar TV
      operationId: getEventBoard
      security: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Maksimal 4 slot upcoming.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardEnvelope" }
        "404":
          $ref: "#/components/responses/Error404"

  /public/v1/tickets:
    post:
      tags: [public]
      summary: Buat tiket baru
      operationId: createTicket
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTicketRequest" }
      responses:
        "201":
          description: Tiket dibuat.
          headers:
            Location:
              description: URL tiket, misalnya `/public/v1/tickets/GL-ABCD`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /public/v1/tickets/{code}/cancellations:
    post:
      tags: [public]
      summary: Batalkan tiket yang belum ditukar
      description: >
        Pengunjung tidak punya akun, jadi memegang kode berarti pemilik tiket.
        Tempat di slot langsung kembali tersedia. Tanpa body.
      operationId: cancelTicket
      security:
        - csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/TicketCode"
      responses:
        "200":
          description: Tiket dibatalkan; `status` sekarang `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketEnvelope" }
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"

  /public/v1/tickets/{code}:
    get:
      tags: [public]
      summary: Lihat tiket berdasarkan kode
      operationId: getTicket
      security: []
      parameters:
        - $ref: "#/components/parameters/TicketCode"
      responses:
        "200":
          description: Tiket ditemukan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketEnvelope" }
        "404":
          $ref: "#/components/responses/Error404"

  /operational/v1/auth/login:
    post:
      tags: [operational]
      summary: Masuk sebagai petugas, admin, atau penyelenggara
      operationId: login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Cookie `antay_session` dipasang.
          headers:
            Set-Cookie:
              description: "`antay_session` HttpOnly, SameSite=Strict."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          description: Email atau kata sandi salah (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"

  /operational/v1/auth/logout:
    post:
      tags: [operational]
      summary: Keluar
      operationId: logout
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "204":
          description: Cookie sesi dihapus.
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /operational/v1/auth/me:
    get:
      tags: [operational]
      summary: User yang sedang login
      operationId: me
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User aktif.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401":
          $ref: "#/components/responses/Error401"

  /operational/v1/events:
    get:
      tags: [operational]
      summary: Semua event hari ini (staff)
      description: Rute loket butuh role `staff` (atau admin); organizer mendapat `403`.
      operationId: listEvents
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Untuk pemilih event di halaman petugas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListEnvelope" }
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      tags: [operational]
      summary: Buat event versi 1 (admin)
      description: >
        Event untuk hari ini, langsung berstatus `published`, tanpa penyelenggara.
        Untuk event dengan kategori dan periode jual, pakai `/operational/v1/manage/events`.
      operationId: createEvent
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event dibuat; `codePrefix` dan `eventDate` diisi server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"

  /operational/v1/events/{eventId}/waiting:
    get:
      tags: [operational]
      summary: Pemegang tiket yang belum ditukar
      operationId: listWaiting
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - name: slot
          in: query
          required: false
          description: Jam mulai dipisah koma, misalnya `10:30,11:00`. Tanpa ini dipakai slot berjalan dan berikutnya.
          schema: { type: string }
      responses:
        "200":
          description: Daftar tiket dan slot yang dipakai.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /operational/v1/events/{eventId}/queue:
    patch:
      tags: [operational]
      summary: Ubah jumlah antrean atau loket
      operationId: updateQueue
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQueueRequest" }
      responses:
        "200":
          description: Event terbaru.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"

  /operational/v1/tickets/{code}:
    get:
      tags: [operational]
      summary: Cek tiket untuk petugas
      operationId: lookupTicket
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketCode"
        - name: eventId
          in: query
          required: false
          description: Event yang sedang dilayani loket. Bila diisi, tiket dari event lain ditandai `wrongEvent`.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tiket dan hasil pemeriksaan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketLookupEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /operational/v1/tickets/{code}/redemptions:
    post:
      tags: [operational]
      summary: Tukar tiket
      operationId: redeemTicket
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/TicketCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedemptionRequest" }
      responses:
        "200":
          description: Tiket berstatus `redeemed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"

  /analytics/v1/events/{eventId}/summary:
    get:
      tags: [analytics]
      summary: Ringkasan satu event (admin)
      operationId: analyticsSummary
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Total dan rincian per slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryEnvelope" }
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"

  /analytics/v1/overview:
    get:
      tags: [analytics]
      summary: Ringkasan semua event hari ini (admin)
      operationId: analyticsOverview
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Satu baris per event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewEnvelope" }
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /media/{fileName}:
    get:
      tags: [media]
      summary: Berkas gambar publik
      description: >
        Bukan JSON. Juga melayani `HEAD`, `Range` (206), dan `If-Modified-Since` (304).
        Nama yang tidak cocok pola selalu `404` dalam format error JSON.
      operationId: getMediaFile
      security: []
      parameters:
        - $ref: "#/components/parameters/FileName"
      responses:
        "200":
          description: Isi berkas.
          headers:
            Content-Type:
              description: Sesuai ekstensi.
              schema: { type: string, enum: [image/jpeg, image/png, image/webp] }
            Cache-Control:
              description: Aman di-cache selamanya karena nama berkas acak.
              schema: { type: string, example: "public, max-age=31536000, immutable" }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
            Last-Modified:
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        "404":
          $ref: "#/components/responses/Error404"

  /customer/v1/auth/register:
    post:
      tags: [customer]
      summary: Daftar akun pembeli
      operationId: customerRegister
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegisterRequest" }
      responses:
        "201":
          description: Akun dibuat dan langsung login; cookie `antay_customer_session` dipasang.
          headers:
            Set-Cookie:
              description: "`antay_customer_session` HttpOnly, SameSite=Strict."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          description: Email sudah terdaftar (`EMAIL_TAKEN`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/Error429"

  /customer/v1/auth/login:
    post:
      tags: [customer]
      summary: Masuk sebagai pembeli
      operationId: customerLogin
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Cookie `antay_customer_session` dipasang.
          headers:
            Set-Cookie:
              description: "`antay_customer_session` HttpOnly, SameSite=Strict."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          description: Email atau kata sandi salah, atau akun nonaktif (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Error403"
        "429":
          $ref: "#/components/responses/Error429"

  /customer/v1/auth/logout:
    post:
      tags: [customer]
      summary: Keluar dari akun pembeli
      description: Tidak butuh sesi valid, supaya cookie kedaluwarsa pun bisa dibersihkan.
      operationId: customerLogout
      security:
        - csrfHeader: []
      responses:
        "204":
          description: Cookie sesi pembeli dihapus.
        "403":
          $ref: "#/components/responses/Error403"

  /customer/v1/me:
    get:
      tags: [customer]
      summary: Profil pembeli yang sedang login
      operationId: customerMe
      security:
        - customerCookie: []
      responses:
        "200":
          description: Profil pembeli.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerEnvelope" }
        "401":
          $ref: "#/components/responses/Error401"
    patch:
      tags: [customer]
      summary: Ubah nama atau nomor WhatsApp
      operationId: customerUpdateMe
      security:
        - customerCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerProfileRequest" }
      responses:
        "200":
          description: Profil terbaru.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"

  /customer/v1/orders/quote:
    post:
      tags: [customer]
      summary: Hitung harga pesanan
      description: >
        Tidak menahan kuota. Kode promo yang tidak terpasang tidak membuat quote
        gagal; alasannya ada di `promoRejection`. Kuota rate limit berbagi dengan
        pesan dan batal tiket (30 per 10 menit per IP).
      operationId: quoteOrder
      security:
        - customerCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: Rincian harga.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteEnvelope" }
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          description: >
            `SALE_ENDED`, `SALE_NOT_OPEN`, `PACKAGE_UNAVAILABLE`, `MIXED_CATEGORY`,
            `PAX_LIMIT` (lebih dari 10 orang), atau `QUOTA_EXCEEDED`. `details`
            menunjuk `items` atau `items[i].packageId` / `items[i].quantity`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/Error429"

  /operational/v1/manage/events:
    get:
      tags: [manage]
      summary: Daftar event yang dikelola
      description: Organizer hanya melihat event miliknya; admin semua. Urut `eventDate` terbaru lalu nama.
      operationId: manageListEvents
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/EventStatus" }
      responses:
        "200":
