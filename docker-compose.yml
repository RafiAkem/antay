services:
  db:
    image: postgres:17-alpine
    container_name: antay-db
    environment:
      POSTGRES_USER: antay
      POSTGRES_PASSWORD: antay
      POSTGRES_DB: antay
    ports:
      - "5432:5432"
    volumes:
      - antay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antay -d antay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  antay-pgdata:
